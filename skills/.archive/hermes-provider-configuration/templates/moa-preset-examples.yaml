# MoA preset templates for ~/.hermes/config.yaml

## Local-only (zero marginal cost)
moa:
  presets:
    reasoning:
      reference_models:
        - provider: lmstudio-studio
          model: microsoft/phi-4-mini-reasoning
        - provider: lmstudio-studio
          model: qwen/qwen3-vl-8b
      aggregator:
        provider: lmstudio-studio
        model: nousresearch/hermes-4-70b
      reference_temperature: 0.7
      aggregator_temperature: 0.4
      max_tokens: 4096
      enabled: true

## Coding-focused
    coding:
      reference_models:
        - provider: lmstudio-studio
          model: google/gemma-4-26b-a4b-qat
        - provider: lmstudio-studio
          model: mistralai/devstral-small-2-2512
      aggregator:
        provider: lmstudio-studio
        model: qwen/qwen3-coder-next
      reference_temperature: 0.6
      aggregator_temperature: 0.3
      max_tokens: 8192
      enabled: true

## Hybrid (local refs, premium aggregator)
    hybrid:
      reference_models:
        - provider: lmstudio-studio
          model: google/gemma-4-26b-a4b-qat
      aggregator:
        provider: openrouter
        model: anthropic/claude-opus-4.8
      enabled: true