# Coding-Focused Auxiliary Models

When using a coding-specialized main model (like Devstral or Qwen-Coder), these auxiliary settings optimize performance:

```yaml
auxiliary:
  vision:
    provider: lmstudio-studio
    model: qwen/qwen3-vl-8b
    base_url: http://your-node.ts.net:1234/v1
  
  web_extract:
    provider: lmstudio-studio
    model: mistralai/devstral-small-2-2512
    base_url: http://your-node.ts.net:1234/v1
  
  compression:
    provider: lmstudio-studio
    model: mistralai/devstral-small-2-2512
  
  skills_hub:
    provider: lmstudio-studio
    model: mistralai/devstral-small-2-2512
  
  mcp:
    provider: lmstudio-studio
    model: mistralai/devstral-small-2-2512
```

## Model Selection Rationale
- **Vision**: `qwen/qwen3-vl-8b` — purpose-built vision, efficient
- **Coding tasks**: `mistralai/devstral-small-2-2512` — small, fast, good at code
- **Text summarization**: Same as main model or smaller variant

## Usage
For profiles where you want consistent coding performance across all tasks.