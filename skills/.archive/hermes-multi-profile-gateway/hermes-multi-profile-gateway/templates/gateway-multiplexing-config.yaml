# Gateway Multiplexing Configuration Sample

This is a sample configuration file showing the multiplexing setting in context.

```yaml
# Hermes Configuration - Sample with multiplexing enabled

gateway:
  multiplex_profiles: true

dashboard:
  basic_auth:
    session_ttl_seconds: 43200
```

## Key Configuration Points

1. **`gateway.multiplex_profiles: true`** - Enables single gateway to serve all profiles
2. **`dashboard.basic_auth.session_ttl_seconds: 43200`** - Sets 12-hour session duration (recommended to avoid login loops)

## Usage Examples

### Enable multiplexing:
```bash
hermes config set gateway.multiplex_profiles true
```

### Verify configuration:
```bash
grep -A2 "multiplex" ~/.hermes/config.yaml
```

### Apply changes:
```bash
hermes gateway restart
```