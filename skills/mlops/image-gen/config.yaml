# Image generation stack configuration — Hermes fleet
#
# Canonical contract for the interactive image-gen skill (picker + executor).
# Consumed by:
#   - picker  (t_7f8898df): enumerates machines -> backends -> models from this
#     file, prompts for settings, emits a request validating against
#     request-schema.json (same directory).
#   - executor (t_e0cf45e5): resolves model_id -> machine/backend, applies
#     settings defaults + validation bounds, runs the generation.
#
# Conventions
#   - Stable model id format: "<machine>:<backend>:<slug>". Never reorder or
#     rename an id once shipped; add new models by appending.
#   - availability: "verified" = probed live on 2026-10-15 and runnable;
#     "unverified" = registered with the server but NOT confirmed (weights may
#     be LFS pointers / not downloaded). Never auto-download; keep unverified
#     models hidden behind a status re-check.
#   - Settings that a backend does not control (e.g. cfg/sampler for Unsloth)
#     are omitted from that model's settings map; the executor must not send
#     them and the picker must not prompt for them.
#   - Bounds marked bounds: verified come from server responses or verified
#     run records; bounds: advisory are sane envelopes, not server-enforced.
#
# Verified live on 2026-10-15 09:4x ET (probed, read-only — nothing downloaded).

schema_version: 1

defaults:
  output_dir: "~/Pictures/image-gen"   # timestamped PNGs land here by default
  history_file: "~/Pictures/image-gen/history.jsonl"  # JSONL run log; --retry reads the last failed entry
  timeout_seconds: 900                 # generation wait cap (ComfyUI poll / Unsloth POST)
  retries: 2                           # executor retries on transient failures (not on 4xx)

machines:
  studio:
    id: studio
    name: "Mac Studio M3 Ultra 96GB"
    reachability: local                # app runs on this host (127.0.0.1)
    tailnet_host: studio.taile85139.ts.net
    backends:
      comfyui:
        id: comfyui
        type: comfyui
        base_url: "http://127.0.0.1:8188"
        tailnet_url: "https://studio.taile85139.ts.net:8188"
        auth: none                     # ComfyUI binds loopback, unauthenticated
        protocol: "ComfyUI /prompt + /history/<id> + /view?filename=&type=output"
        notes: >
          Weights root /Users/macstudio/models/diffusion via
          /Users/macstudio/ComfyUI/extra_model_paths.yaml. Blueprints are
          editor-format; convert with comfy_editor_to_api.py --raw
          --schema-out then run with comfyui run_workflow.py.
      unsloth:
        id: unsloth
        type: unsloth
        base_url: "http://127.0.0.1:8888"
        tailnet_url: "https://studio.taile85139.ts.net:8888"
        auth:
          type: bearer
          keyfile: "/Users/macstudio/.unsloth/studio/auth/agent_api_key.json"
          key_pick: >
            servers.<base_url>.minted[] newest-first, then saved[]; try each
            candidate until one authenticates. Observed 2026-10-15: minted[1]
            (newest) was stale/401 while minted[0] worked.
        protocol: "OpenAI-compatible POST /v1/images/generations; inventory GET
          /api/inference/models, /api/inference/images/{info,status,load,load-progress}"
        notes: >
          Loopback; port 8888 is the Unsloth Studio app. If refused, app not
          running. /v1/images/generations 503s until a model is loaded; issue
          /api/inference/images/load first (single-file GGUF repos need
          model_kind=gguf + gguf_filename).

  macbook:
    id: macbook
    name: "MacBook Pro M5 64GB"
    reachability: ssh                   # loopback-only services; reach via `ssh macbook`
    ssh_host: macbook
    user: prasta
    backends:
      unsloth:
        id: unsloth
        type: unsloth
        base_url: "http://127.0.0.1:8888"   # bound to loopback on the MacBook
        auth:
          type: bearer
          keyfile: "/Users/prasta/.unsloth/studio/auth/agent_api_key.json"
          key_pick: >
            servers.<base_url>.minted[] newest-first, then saved[]; try each
            candidate until one authenticates.
        protocol: "Same Unsloth API as studio; reachable only over ssh."
        notes: >
          Auth headers must ride a `curl -K-` stdin config over ssh (-H args
          do not survive the ssh argv boundary -> 401 "Not authenticated").
          Do NOT curl http://127.0.0.1:8888 from the Studio directly — the
          port is loopback-bound on the MacBook, not on this machine.

models:
  # ---------------------------------------------------------------- Studio · ComfyUI
  - id: studio:comfyui:z-image-turbo
    machine: studio
    backend: comfyui
    family: z-image
    kind: t2i
    display: "Z-Image-Turbo (fast)"
    availability: verified
    weights:
      unet: z_image_turbo_bf16.safetensors
      clip: qwen_3_4b.safetensors
      clip_type: lumina2
      vae: ae.safetensors
    graph:
      blueprint: "Text to Image (Z-Image-Turbo).json"   # editor format; convert to run
    notes: >
      ~30s for 512x512/6 steps incl. model swap (96GB RAM, bf16 ~20.5GB resident).
      1024² is native; 512² is the quick-draft option.
    settings:
      width:        {default: 1024, min: 512, max: 1536, multiple_of: 8,  bounds: advisory}
      height:       {default: 1024, min: 512, max: 1536, multiple_of: 8,  bounds: advisory}
      steps:        {default: 6,    min: 4,   max: 8,                     bounds: verified}
      cfg_scale:    {default: 1.0,  min: 1.0, max: 1.0,                   bounds: verified}
      seed:         {default: null, min: 0,   max: 4294967295,            bounds: advisory}
      sampler:      {default: res_multistep, choices: [res_multistep],    bounds: verified}
      scheduler:    {default: simple,         choices: [simple],          bounds: verified}
      denoise:      {default: 1.0,  min: 0.0, max: 1.0,                   bounds: advisory}

  - id: studio:comfyui:qwen-image-2.1-int8
    machine: studio
    backend: comfyui
    family: qwen-image-2.1
    kind: t2i
    display: "Qwen-Image-2.1 int8 (text/fidelity)"
    availability: verified
    weights:
      unet: qwen_image_2.1_int8_convrot.safetensors
      clip: qwen3vl_8b_int8_convrot.safetensors
      clip_type: qwen_image
      vae: qwen_image_2.1_vae_bf16.safetensors
      # NOTE: live loader choices also show qwen3.5_9b_qwen_image_2.1_pe_t2i.int8_convrot.safetensors
      # as a CLIP candidate — present on disk but not yet referenced by any verified graph.
      # If the executor re-wires the graph, re-verify with vision_analyze before pinning.
    graph:
      api_graph: "~/.hermes/skills/creative/comfyui/workflows/qwen_img21_txt2img_int8.json"
      latent_node: TextEncodeQwenImage21   # width == height == resolution single value
    notes: >
      Pre-converted API graph, runs directly (bare map) under comfyui
      run_workflow.py. Slower than Z-Image; best text rendering on this stack.
      Resolution is a single int (default 1024); width/height must be equal.
    settings:
      width:        {default: 1024, min: 512, max: 1536, multiple_of: 8,  bounds: advisory, note: "must equal height (resolution param)"}
      height:       {default: 1024, min: 512, max: 1536, multiple_of: 8,  bounds: advisory, note: "must equal width (resolution param)"}
      steps:        {default: 25,   min: 20,  max: 25,                    bounds: verified}
      cfg_scale:    {default: 1.0,  min: 1.0, max: 1.0,                   bounds: verified}
      seed:         {default: null, min: 0,   max: 4294967295,            bounds: advisory}
      sampler:      {default: euler, choices: [euler],                    bounds: verified}
      scheduler:    {default: simple,          choices: [simple],         bounds: verified}
      denoise:      {default: 1.0,  min: 0.0, max: 1.0,                   bounds: advisory}

  # ------------------------------------------------------------------ Studio · Unsloth
  - id: studio:unsloth:qwen-image-2.1-gguf
    machine: studio
    backend: unsloth
    family: qwen-image-2.1
    kind: t2i
    display: "Qwen-Image-2.1 GGUF Q4_K_M"
    availability: verified
    repo: unsloth/Qwen-Image-2.1-GGUF
    quant: Q4_K_M
    gguf_filename: qwen-image-2.1-Q4_K_M.gguf
    model_kind: gguf
    workflows: [txt2img, reference, edit]
    server_limits:                             # from /api/inference/images/status conditioning (verified)
      dimension_multiple: 32
      max_output_side: 2752
      max_output_pixels: 4300800
      max_condition_images: 10
    notes: >
      Loaded on the Studio at probe time (MPS, bf16, text encoder int8).
      Weights verified present 2026-11-05: the cache repo dir is 16K but its
      single blob is 4.20 GB (inode 254335032, links=1) — measure blobs, not
      symlinks. The backend must be RUNNING before a generation succeeds;
      a closed :8888 means "not started", not "not runnable".
      transformer cache (taylor1) arms at 25 steps — keep steps >= 25 for
      full fidelity. negative_prompt supported. init-image + strength for
      reference/edit workflows.
    settings:
      width:        {default: 1024, min: 256, max: 2752, multiple_of: 32, bounds: verified}
      height:       {default: 1024, min: 256, max: 2752, multiple_of: 32, bounds: verified}
      steps:        {default: 25,   min: 20,  max: 50,                     bounds: advisory, note: ">=25 recommended (cache arms at 25)"}
      seed:         {default: null, min: 0,   max: 4294967295,             bounds: advisory}
      n:            {default: 1,    min: 1,   max: 4,                      bounds: advisory}
      strength:     {default: null, min: 0.0, max: 1.0,                    bounds: advisory, note: "edit/reference only; null for t2i"}
    area_rule: "width*height <= 4300800 (verified server limit)"

  - id: studio:unsloth:qwen-image-2.1-turbo-gguf
    machine: studio
    backend: unsloth
    family: qwen-image-2.1
    kind: t2i
    display: "Qwen-Image-2.1 Turbo GGUF F16"
    availability: unverified               # registered with server, NOT loaded; may need download
    repo: unsloth/Qwen-Image-2.1-Turbo-GGUF
    quant: F16
    workflows: [txt2img, reference, edit]
    notes: >
      Listed by /api/inference/models but loaded=false at probe time. Do NOT
      pre-download: hide until /api/inference/images/status confirms weights.
      Same qwen-image-2.1 conditioning limits as the Q4_K_M variant.

  # ---------------------------------------------------------------- MacBook · Unsloth
  - id: macbook:unsloth:qwen-image-2.1-uncensored
    machine: macbook
    backend: unsloth
    family: qwen-image-2.1
    kind: t2i
    display: "Qwen-Image-2.1 Uncensored Q4_K_M"
    availability: verified
    repo: abenzerps/Qwen-Image-2.1-Uncensored-Quantized
    quant: Q4_K_M
    gguf_filename: qwen-image-2.1-UC-Q4_K_M.gguf
    model_kind: gguf
    workflows: [txt2img, reference, edit]
    server_limits:                             # identical conditioning to studio variant
      dimension_multiple: 32
      max_output_side: 2752
      max_output_pixels: 4300800
      max_condition_images: 10
    notes: >
      Loaded on the MacBook at probe time (MPS, bf16, text encoder int8) —
      this is the machine's only confirmed t2i-capable model. text2img,
      reference, edit all supported. Reached over ssh; auth via curl -K-.
    settings:
      width:        {default: 1024, min: 256, max: 2752, multiple_of: 32, bounds: verified}
      height:       {default: 1024, min: 256, max: 2752, multiple_of: 32, bounds: verified}
      steps:        {default: 25,   min: 20,  max: 50,                     bounds: advisory, note: ">=25 recommended (cache arms at 25)"}
      seed:         {default: null, min: 0,   max: 4294967295,             bounds: advisory}
      n:            {default: 1,    min: 1,   max: 4,                      bounds: advisory}
      strength:     {default: null, min: 0.0, max: 1.0,                    bounds: advisory, note: "edit/reference only; null for t2i"}
    area_rule: "width*height <= 4300800 (verified server limit)"

  - id: macbook:unsloth:qwen-image-2.1-gguf
    machine: macbook
    backend: unsloth
    family: qwen-image-2.1
    kind: t2i
    display: "Qwen-Image-2.1 GGUF Q4_K_M (unverified)"
    availability: unverified               # registered, NOT loaded; cache may hold LFS pointers only
    repo: unsloth/Qwen-Image-2.1-GGUF
    quant: Q4_K_M
    workflows: [txt2img, reference, edit]
    notes: >
      Registered with the MacBook server but loaded=false at probe time.
      backends.md (2026-10-14) recorded its HF cache holding LFS pointers only
      (~28K) — NOT confirmed runnable. Do not offer until
      /api/inference/images/status confirms real weights; do not auto-download.

# Picker/executor contract (read this before wiring the tasks)
#   - The picker presents machines -> backends -> models where
#     availability == verified (optionally surfacing unverified ones greyed
#     out). model_id is the stable id string above.
#   - Settings the picker prompts for come from the model's `settings` map:
#     defaults shown, bounds enforced client-side; executor re-validates
#     against the same map.
#   - The executor resolves model_id, routes to machine/backend, applies
#     auth per backend, calls the API, downloads the image, saves
#     "<defaults.output_dir>/<timestamp>[-suffix].png" and returns the path.
#   - Request payload shape is defined in request-schema.json (same dir).
